---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      copr:
        - atim/starship
        - dejan/lazygit
        - imput/helium
        - lionheartp/Hyprland
        - ublue-os/packages
      nonfree: rpmfusion
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
      cleanup: true
    install:
      packages:
        # System utilities
        - git
        - ublue-setup-services

        # Terminal utilities
        - kitty
        - fastfetch
        - starship
        - btop
        - docker-cli
        - podman-compose

        # Lazyvim stuff
        - neovim
        - lazygit
        - tree-sitter-cli
        - ripgrep
        - fd-find

        # Desktop
        - xdg-desktop-portal-hyprland
        - hyprland
        - uwsm
        - hyprpolkitagent
        - noctalia-git
        - noctalia-greeter-git
        - adw-gtk3-theme
        - nwg-look
        - qt5ct
        - qt6ct
        - kvantum
        - plasma-breeze
        - breeze-gtk
        - quickshell

        # Browser
        - helium-bin

        # Applications
        - code
        - dolphin
        - file-roller
        - gwenview
        - mpv
        - okular
    replace:
      - from-repo: fedora
        packages:
          - old: tuned-ppd
            new: power-profiles-daemon
