---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  # Fedora packages
  - type: dnf
    install:
      packages:
        # System utilities
        - git
        # Terminal utilities
        - kitty
        - fastfetch
        - btop
        - docker-cli
        - podman-compose
        # Lazyvim stuff
        - neovim
        - tree-sitter-cli
        - ripgrep
        - fd-find
        # Desktop
        - adw-gtk3-theme
        - qt5ct
        - kvantum
        - plasma-breeze
        - breeze-gtk
        # Applications
        - dolphin
        - file-roller
        - gwenview
        - mpv
        - okular
    replace:
      - from-repo: fedora
        packages:
          - old: tuned-ppd
            new: power-profiles-daemon

  # Non-Fedora packages
  - type: dnf
    repos:
      copr:
        - atim/starship
        - dejan/lazygit
        - imput/helium
        - lihaohong/yazi
        - ublue-os/packages
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
        - https://pkgs.tailscale.com/stable/fedora/repo.gpg
      cleanup: true
    install:
      packages:
        # System utilities
        - ublue-setup-services
        - tailscale
        # Terminal utilities
        - starship
        - lazygit
        # Browser
        - helium-bin
        # Applications
        - code
        - yazi

  # Hyprland & Noctalia packages
  - type: dnf
    repos:
      copr:
        - lionheartp/Hyprland
      cleanup: true
    install:
      packages:
        - xdg-desktop-portal-hyprland
        - hyprland
        - uwsm
        - hyprpolkitagent
        - noctalia-git
        - noctalia-greeter-git
        - nwg-look
        - qt6ct
        - quickshell
