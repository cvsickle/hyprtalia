---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  # Fedora packages
  - type: dnf
    install:
      packages:
        # System utilities
        - git
        # Terminal utilities
        - kitty
        - fastfetch
        - btop
        - docker-cli
        - podman-compose
        # Lazyvim stuff
        - neovim
        - tree-sitter-cli
        - ripgrep
        - fd-find
        # Desktop
        - adw-gtk3-theme
        - qt5ct
        - kvantum
        - plasma-breeze
        - breeze-gtk
        # Applications
        - dolphin
        - file-roller
        - gwenview
        - mpv
        - okular
    replace:
      - from-repo: fedora
        packages:
          - old: tuned-ppd
            new: power-profiles-daemon

  # Tailscale
  - type: dnf
    repos:
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      cleanup: true
    install:
      packages:
        - tailscale

  # VS Code
  - type: dnf
    repos:
      files:
        - https://packages.microsoft.com/yumrepos/vscode/config.repo
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
      cleanup: true
    install:
      packages:
        - code

  # Universal Blue
  - type: dnf
    repos:
      copr:
        - ublue-os/packages
      cleanup: true
    install:
      packages:
        - ublue-setup-services

  # Starship
  - type: dnf
    repos:
      copr:
        - atim/starship
      cleanup: true
    install:
      packages:
        - starship

  # Lazygit
  - type: dnf
    repos:
      copr:
        - dejan/lazygit
      cleanup: true
    install:
      packages:
        - lazygit

  # Helium browser
  - type: dnf
    repos:
      copr:
        - imput/helium
      cleanup: true
    install:
      packages:
        - helium-bin

  # Yazi
  - type: dnf
    repos:
      copr:
        - lihaohong/yazi
      cleanup: true
    install:
      packages:
        - yazi

  # Hyprland & Noctalia packages
  - type: dnf
    repos:
      copr:
        - lionheartp/Hyprland
      cleanup: true
    install:
      packages:
        - xdg-desktop-portal-hyprland
        - hyprland
        - uwsm
        - hyprpolkitagent
        - noctalia-git
        - noctalia-greeter-git
        - nwg-look
        - qt6ct
        - quickshell
